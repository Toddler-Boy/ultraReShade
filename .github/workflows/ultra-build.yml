name: ultraReShade build

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to build
        type: string
        default: main

permissions: {}

jobs:
  build:
    runs-on: windows-2025

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install glad requirements
        run: pip install -r deps/glad/requirements.txt

      - name: Build ReShade (32-bit)
        run: |
          cmake -S . -B build/x86 -G "Visual Studio 18 2026" -A Win32 -T ClangCL
          cmake --build build/x86 --config Release --target ReShade --parallel

      - name: Build ReShade (64-bit)
        run: |
          cmake -S . -B build/x64 -G "Visual Studio 18 2026" -A x64 -T ClangCL
          cmake --build build/x64 --config Release --target ReShade --parallel

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/x86/Release/ReShade32.dll, build/x64/Release/ReShade64.dll, setup/ReShade32.json, setup/ReShade64.json, LICENSE.md dist/

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ultraReShade
          path: dist/
